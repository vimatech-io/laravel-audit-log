name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        stability: ['prefer-lowest', 'prefer-stable']
        include:
          - laravel: '11.*'
            testbench: '9.*'
            pest: '^3.0'
            pest_plugin: '^3.0'
          - laravel: '12.*'
            testbench: '10.*'
            pest: '^3.0'
            pest_plugin: '^3.0'
          - laravel: '13.*'
            testbench: '11.*'
            pest: '^4.0'
            pest_plugin: '^4.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }}" --no-interaction --no-update --dev
          # --prefer-stable is always passed: three packages declare
          # minimum-stability: dev, and --prefer-lowest alone would resolve
          # to dev releases instead of the real lower bound.
          composer update --${{ matrix.stability }} --prefer-stable --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  # This package installs an append-only trigger with SQL specific to each
  # engine (src/Support/AppendOnlyTrigger.php); the eight other packages in
  # the canon ship no engine-specific SQL and have no equivalent job. Run
  # once per engine on the newest supported PHP/Laravel/Pest combination:
  # the trigger SQL itself doesn't change across Laravel versions, so the
  # `tests` matrix above already covers that axis.
  postgres-append-only:
    runs-on: ubuntu-latest
    name: Append-only trigger on PostgreSQL

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_log
          POSTGRES_PASSWORD: audit_log
          POSTGRES_DB: audit_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update --dev
          composer update --prefer-stable --no-interaction

      - name: Run tests against PostgreSQL
        env:
          AUDIT_LOG_TEST_DRIVER: pgsql
          AUDIT_LOG_TEST_HOST: 127.0.0.1
          AUDIT_LOG_TEST_PORT: 5432
          AUDIT_LOG_TEST_DATABASE: audit_log
          AUDIT_LOG_TEST_USERNAME: audit_log
          AUDIT_LOG_TEST_PASSWORD: audit_log
        run: vendor/bin/pest

  mysql-append-only:
    runs-on: ubuntu-latest
    name: Append-only trigger on MySQL

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: audit_log
          MYSQL_DATABASE: audit_log
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update --dev
          composer update --prefer-stable --no-interaction

      - name: Run tests against MySQL
        env:
          # MySQL 8 refuses CREATE TRIGGER from an unprivileged user while
          # binary logging is on (error 1419); root carries the SUPER
          # privilege that grants it, so the test connection uses root
          # against this throwaway service database, not an app-shaped user.
          AUDIT_LOG_TEST_DRIVER: mysql
          AUDIT_LOG_TEST_HOST: 127.0.0.1
          AUDIT_LOG_TEST_PORT: 3306
          AUDIT_LOG_TEST_DATABASE: audit_log
          AUDIT_LOG_TEST_USERNAME: root
          AUDIT_LOG_TEST_PASSWORD: audit_log
        run: vendor/bin/pest

  # `mariadb` is its own Laravel driver name (Illuminate\Database\MariaDbConnection),
  # not an alias resolved to `mysql`, and AppendOnlyTrigger's match arms, and
  # the query-builder tests, both branch on the literal string. The job above
  # never exercised that branch: naming MariaDB in its title didn't run it.
  mariadb-append-only:
    runs-on: ubuntu-latest
    name: Append-only trigger on MariaDB

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: audit_log
          MARIADB_DATABASE: audit_log
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update --dev
          composer update --prefer-stable --no-interaction

      - name: Run tests against MariaDB
        env:
          # The trigger SQL this sends is identical to the MySQL job's: the
          # two share one installMysql()/pruningMysql() implementation, so
          # this job proves MariaDB accepts that same SQL, not that
          # different SQL runs. The privilege story is not identical,
          # though, and was checked rather than copied: MariaDB enforces the
          # same SUPER-if-binlog-is-on restriction as MySQL (error 1419,
          # confirmed against a real server with binlog forced on), but the
          # official mariadb image ships with binary logging off by
          # default, unlike mysql:8. An app-shaped user would pass here by
          # accident, without the binlog state that makes the check mean
          # anything. Root sidesteps that regardless of the image default.
          AUDIT_LOG_TEST_DRIVER: mariadb
          AUDIT_LOG_TEST_HOST: 127.0.0.1
          AUDIT_LOG_TEST_PORT: 3306
          AUDIT_LOG_TEST_DATABASE: audit_log
          AUDIT_LOG_TEST_USERNAME: root
          AUDIT_LOG_TEST_PASSWORD: audit_log
        run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest
    name: Static analysis & code style

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse
